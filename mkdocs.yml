site_name: AOE Wiki
site_url: https://teamaof.github.io/AOE-Wiki/
theme:
  name: material
markdown_extensions:
  - admonition
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  
copyright: Copyright &copy; 2025 Team AOE
nav:
  - Home: index.md
  - Mod Packs:
    - Craftoria: mod-packs/Craftoria.md
    - All of Fabric 7: mod-packs/aof7.md
    - All of Fabric 6: mod-packs/aof6.md
    - All of Fabric 5: mod-packs/aof5.md
    - All of Fabric 4: mod-packs/aof4.md
    - All of Fabric 3: mod-packs/aof3.md
  - Servers:
    - Official Servers: servers/official_servers.md
    - Your own server: servers/server.md
  - Launchers:
    - CurseForge: launchers/curseforge.md
    - Prism Launcher: launchers/prism.md